<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="images/flower.png">
<title>sunday reset</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="perfectsundayreset">
<h2 class="roomreset-title">your perfect sunday reset</h2>
<section>
  <p>are you ready to prepare for your perfect week ahead?</p>
</section>
</div>

<div class="roomreset">
    <h2>room reset</h2>
    <div class ="roomresettodolist">
    <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="start music, open windows + curtains">
        <span class="checkmark"></span>
        <span class="todo-text">start music, open windows + curtains</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="pick up any dishes if there are any">
        <span class="checkmark"></span>
        <span class="todo-text">pick up any dishes if there are any</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="bring dirty clothes down for laundry + wash clothes if needed">
        <span class="checkmark"></span>
        <span class="todo-text">bring dirty clothes down for laundry + wash clothes if needed</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="empty bins + wipe down bins">
        <span class="checkmark"></span>
        <span class="todo-text">empty bins + wipe down bins"</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="wash/sanitise blankets">
        <span class="checkmark"></span>
        <span class="todo-text">wash/sanitise blankets</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="empty bags and sort them away">
        <span class="checkmark"></span>
        <span class="todo-text">empty bags and sort them away</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="pick up any trash + put in bin">
        <span class="checkmark"></span>
        <span class="todo-text">pick up any trash + put in bin</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="clean and organise desk">
        <span class="checkmark"></span>
        <span class="todo-text">clean and organise desk</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="clean out the floor">
        <span class="checkmark"></span>
        <span class="todo-text">clean out the floor</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="vacuum the floor">
        <span class="checkmark"></span>
        <span class="todo-text">vacuum the floor</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="bring clean clothes up + organise the wardrobe">
        <span class="checkmark"></span>
        <span class="todo-text">bring clean clothes up + organise the wardrobe</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="final vaccum, dust, empty bin">
        <span class="checkmark"></span>
        <span class="todo-text">final vaccum, dust, empty bin</span>
        </label>
</div>
</div>

<div class="loungereset">
    <h2>lounge room reset</h2>
    <div class ="loungeresettodolist">
    <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="start music, open windows + curtains">
        <span class="checkmark"></span>
        <span class="todo-text">start music, open windows + curtains</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="remove any dishes, clothes, rubbish">
        <span class="checkmark"></span>
        <span class="todo-text">remove any dishes, clothes, rubbish</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="gather magazines, papers and books and sort them into their respective areas">
        <span class="checkmark"></span>
        <span class="todo-text">gather magazines, papers and books and sort them into their respective areas</span>
        </label>
   <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="clear the coffee table, wipe it down and reorganise">
        <span class="checkmark"></span>
        <span class="todo-text">clear the coffee table, wipe it down and reorganise</span>
        </label>
   <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="return any remote controls to their areas">
        <span class="checkmark"></span>
        <span class="todo-text">return any remote controls to their areas</span>
        </label>
   <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="take everything off, vacuum and sanitise the couch">
        <span class="checkmark"></span>
        <span class="todo-text">take everythign off, vacuum and sanitise the couch</span>
        </label>
   <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="straighten and reorganise cushions, throws">
        <span class="checkmark"></span>
        <span class="todo-text">straighten and reorganise cushions, throws</span>
        </label>
   <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="vacuum (mop if needed) floor and rugs">
        <span class="checkmark"></span>
        <span class="todo-text">vacuum (mop if needed) floor and rugs</span>
        </label>
   <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="finish organising books, magazines, mail and decor">
        <span class="checkmark"></span>
        <span class="todo-text">finish organising books, magazines, mail and decor</span>
        </label>
   <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="wipe down surfaces like drawers, shelves, tv">
        <span class="checkmark"></span>
        <span class="todo-text">wipe down surfaces like drawers, shelves, tv</span>
        </label>
   <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="final surface wipe, dust and vacuum">
        <span class="checkmark"></span>
        <span class="todo-text">final surface wipe, dust and vacuum</span>
        </label>
</div>
</div>

<div class="kitchenreset">
    <h2>kitchen reset</h2>
    <div class ="kitchenresettodolist">
    <label class ="todoitem">
        <input type="checkbox" name="roomreset" value="start music, open windows + curtains">
        <span class="checkmark"></span>
        <span class="todo-text">start music, open windows + curtains</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="bring dishes from around the house back, rinse them, stack in dishwasher and start cycle">
        <span class="checkmark"></span>
        <span class="todo-text">bring dishes from around the house back, rinse them, stack in dishwasher and start cycle</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="clear all items, put stuff in their respective areas">
        <span class="checkmark"></span>
        <span class="todo-text">clear all items, put stuff in their respective areas</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="lightly wipe down surfaces">
        <span class="checkmark"></span>
        <span class="todo-text">lightly wipe down surfaces</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="scrub sink basin, clean faucet, shine metal, run a disposal cleaner">
        <span class="checkmark"></span>
        <span class="todo-text">scrub sink basin, clean faucet, shine metal, run a disposal cleaner</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="wipe up spills on stovetop and clean grates if applicable">
        <span class="checkmark"></span>
        <span class="todo-text">wipe up spills on stovetop and clean grates if applicable</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="disassemble range hood and wipe over inside and outside">
        <span class="checkmark"></span>
        <span class="todo-text">disassemble range hood and wipe over inside and outside</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="microwave a bowl of water with lemon to loosen grime, then wipe the interior and exterior of microwave">
        <span class="checkmark"></span>
        <span class="todo-text">microwave a bowl of water with lemon to loosen grime, then wipe the interior and exterior of microwave</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="diassemble oven and scrub through grease">
        <span class="checkmark"></span>
        <span class="todo-text">diassemble oven and scrub through grease</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="reorganise refridgerator, toss out expired food">
        <span class="checkmark"></span>
        <span class="todo-text">reorganise refridgerator, toss out expired food</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="wipe down exterior (and interior if you want) of refridgerator">
        <span class="checkmark"></span>
        <span class="todo-text">wipe down exterior (and interior if you want) of refridgerator</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="clean out pantry and throw away any expired foods and spices">
        <span class="checkmark"></span>
        <span class="todo-text">clean out pantry and throw away any expired foods and spices</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="sweep or vacuum, then mop the floor thoroughly">
        <span class="checkmark"></span>
        <span class="todo-text">then mop the floor thoroughly</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="spot clean cabinet fronts and wipe down all knobs and pulls">
        <span class="checkmark"></span>
        <span class="todo-text">spot clean cabinet fronts and wipe down all knobs and pulls</span>
        </label>
    <label class ="todoitem">
        <input type="checkbox" name="final dust and vacuum and empty bins">
        <span class="checkmark"></span>
        <span class="todo-text">final dust and vacuum and empty bins</span>
        </label>
</div>
</div>


</body>
</html>
